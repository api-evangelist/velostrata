name: Velostrata
description: 'Velostrata was an enterprise cloud-migration technology company founded in 2014 by Issy Ben-Shaul
  and Ady Degany, headquartered in San Mateo, California with an R&D center in Netanya, Israel. Its patented
  agentless technology decoupled compute from storage so that workloads could run in the cloud within minutes
  while the bulk storage migration streamed in the background without performance degradation. Backed by Intel
  Capital, Norwest Venture Partners and 83North (roughly $31.5M raised across Series A and B rounds), Velostrata
  was acquired by Google in May 2018 (estimated $100M-$200M). The team joined Google Cloud in Tel Aviv and the
  product was rebranded Migrate for Compute Engine, later Migrate for Virtual Machines. Velostrata no longer
  operates as an independent company and publishes no independent API: velostrata.com now redirects to Google
  Cloud''s Migrate for Virtual Machines documentation.'
